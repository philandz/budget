[package]
name = "budget"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tonic-build = "0.12"

[dependencies]
axum = "0.8.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio", "macros", "chrono", "uuid", "migrate"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
philand_logging    = { package = "logging",     path = "../libs/logging" }
philand_configs    = { package = "configs",     path = "../libs/configs" }
philand_storage    = { package = "storage",     path = "../libs/storage" }
philand_table      = { package = "table",       path = "../libs/table" }
philand_application = { package = "application", path = "../libs/application" }
philand_env        = { package = "env",         path = "../libs/env" }
philand_time       = { package = "time",        path = "../libs/time" }
philand_random     = { package = "random",      path = "../libs/random" }
philand_validator  = { package = "validator",   path = "../libs/validator" }
philand_notify     = { package = "notify",       path = "../libs/notify" }
rust_decimal      = { version = "1", features = ["serde-with-str"] }

[dev-dependencies]
serial_test = "3"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
